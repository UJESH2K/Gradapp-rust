[package]
name = "gm-ports"
description = "Ports: pinned per-backend PyTorch runtimes provisioned with uv and a private CPython"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gm-types.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tokio.workspace = true
# Native roots as well as webpki: corporate and lab networks often terminate TLS
# at a proxy whose CA is only in the OS store (or SSL_CERT_FILE).
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
sha2.workspace = true
hex.workspace = true
dirs.workspace = true
tracing.workspace = true
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
gethostname = "1"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
